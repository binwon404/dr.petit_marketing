<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<!-- 브라우저의 자동 번역이 화면 글자를 덮어쓰지 않게 막음 (언어는 화면의 선택 칸으로 바꿈) -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅 관리보드 - 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-top">
      <div>
        <p class="eyebrow" data-i18n>마케팅 관리보드</p>
        <h1 data-i18n>어느 계정으로 들어갈까요?</h1>
      </div>
      <div class="login-tools">
        <a class="guide-link" href="guide.html" target="_blank" rel="noopener" data-i18n>가이드</a>
        <select class="lang-select" data-lang-select aria-label="언어 / 言語 / 语言 / Language"></select>
      </div>
    </div>
    <form id="login-form">
      <div class="acct-list" id="acct-list"><p class="empty" data-i18n>계정 목록을 불러오는 중이에요</p></div>
      <label class="field"><span data-i18n>비밀번호</span><input type="text" id="pw" class="pin-mask" inputmode="numeric" maxlength="4" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="숫자 4자리" data-i18n-ph></label>
      <p class="note" id="login-error" role="alert" hidden></p>
      <button class="btn block" id="login-btn" data-i18n>들어가기</button>
    </form>
    <p class="hint" data-i18n>비밀번호를 10번 틀리면 10분 동안 잠겨요. 비밀번호는 관리자에게 물어봐 주세요.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
