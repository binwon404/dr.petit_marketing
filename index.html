<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅 관리보드 - 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div>
      <p class="eyebrow">마케팅 관리보드</p>
      <h1>어느 계정으로 들어갈까요?</h1>
    </div>
    <form id="login-form">
      <div class="acct-list" id="acct-list"></div>
      <label class="field"><span>비밀번호</span><input type="password" id="pw" placeholder="시안에서는 확인하지 않아요"></label>
      <button class="btn block">들어가기</button>
    </form>
    <p class="hint">시안 화면이에요. 실제 로그인은 Supabase 연결 후 적용돼요.</p>
  </main>
  <script src="js/demo-data.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
